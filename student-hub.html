<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리반 누리집 - 학생 마당</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/store.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 공통 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">🏫</span>
        <h1 id="header-title" class="font-extrabold text-lg text-slate-900">우리반 누리집</h1>
        <span class="px-2.5 py-0.5 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full">학생 마당</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="student-badge" class="text-sm font-bold text-slate-700"></span>
        <button onclick="logout()" class="px-3 py-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg">
          나가기
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-8">
    
    <!-- 선생님 개별 피드백 영역 -->
    <section id="feedback-section" class="bg-amber-50 border border-amber-200 rounded-2xl p-6 shadow-xs">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-xl">💌</span>
        <h2 class="font-bold text-amber-950 text-base">선생님께서 나에게 보낸 메시지</h2>
      </div>
      <p id="teacher-feedback-text" class="text-sm text-amber-900 leading-relaxed whitespace-pre-line">
        아직 도착한 선생님 메시지가 없습니다.
      </p>
    </section>

    <!-- 앱 선택 그리드 -->
    <section>
      <h2 class="text-lg font-bold text-slate-900 mb-4">📱 우리 반 활동 앱 선택</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <!-- 앱 1: 친구와 나 알아보기 -->
        <a href="app-survey.html" class="group bg-white rounded-2xl border border-slate-200 hover:border-indigo-500 p-6 shadow-xs hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition">
              🤝
            </div>
            <h3 class="font-bold text-lg text-slate-900 mb-1">친구와 나 알아보기</h3>
            <p class="text-xs text-slate-500 leading-relaxed">
              나의 평소 성향과 관심사를 알아보고, 우리 반 친구들과의 마음 연결 설문에 참여합니다.
            </p>
          </div>
          <div class="mt-6 pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-indigo-600">
            <span>활동 시작하기</span>
            <span>→</span>
          </div>
        </a>

        <!-- 향후 앱 확장을 위한 안내 플레이스홀더 -->
        <div class="rounded-2xl border-2 border-dashed border-slate-200 p-6 flex flex-col items-center justify-center text-center text-slate-400">
          <span class="text-2xl mb-2">✨</span>
          <p class="text-xs font-medium">새로운 학급 활동 앱이<br/>이곳에 추가될 예정입니다.</p>
        </div>

      </div>
    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const stu = ClassStore.getCurrentStudent();
      if (!stu) {
        alert('로그인이 필요합니다.');
        window.location.href = 'index.html';
        return;
      }

      const title = ClassStore.getTitle();
      document.title = `${title} - 학생 마당`;
      document.getElementById('header-title').innerText = title;
      document.getElementById('student-badge').innerText = `${stu.num}번 ${stu.name}`;

      // 선생님 피드백 로드
      const feedbacks = ClassStore.getFeedbacks();
      const myKey = `${stu.num}_${stu.name}`;
      if (feedbacks[myKey]) {
        document.getElementById('teacher-feedback-text').innerText = feedbacks[myKey];
      }
    });

    function logout() {
      ClassStore.logoutStudent();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
