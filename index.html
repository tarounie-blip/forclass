<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리반 누리집</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/store.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 py-5">
    <div class="max-w-4xl mx-auto px-4 flex items-center justify-center gap-3">
      <span class="text-3xl">🏫</span>
      <h1 id="portal-title" class="text-2xl font-extrabold text-slate-900 tracking-tight">우리반 누리집</h1>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="max-w-3xl w-full grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- 학생 입장 카드 -->
      <div onclick="openStudentModal()" class="group cursor-pointer bg-white rounded-3xl p-8 border-2 border-slate-200 hover:border-indigo-500 shadow-sm hover:shadow-md transition flex flex-col items-center text-center">
        <div class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition">
          🎒
        </div>
        <h2 class="text-xl font-bold text-slate-900 mb-2">학생 입장</h2>
        <p class="text-sm text-slate-500 leading-relaxed">
          내 이름과 비밀번호를 입력하고<br/>우리 반 활동 앱과 선생님 피드백을 확인해요.
        </p>
        <span class="mt-6 px-5 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl group-hover:bg-indigo-700 transition">
          학생으로 로그인 →
        </span>
      </div>

      <!-- 교사 입장 카드 -->
      <div onclick="openTeacherModal()" class="group cursor-pointer bg-white rounded-3xl p-8 border-2 border-slate-200 hover:border-slate-800 shadow-sm hover:shadow-md transition flex flex-col items-center text-center">
        <div class="w-16 h-16 rounded-2xl bg-slate-100 text-slate-700 flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition">
          👩‍🏫
        </div>
        <h2 class="text-xl font-bold text-slate-900 mb-2">교사 입장</h2>
        <p class="text-sm text-slate-500 leading-relaxed">
          학급 명단과 비밀번호를 관리하고<br/>학생들의 활동 결과 분석 및 피드백을 작성합니다.
        </p>
        <span class="mt-6 px-5 py-2.5 bg-slate-800 text-white text-sm font-bold rounded-xl group-hover:bg-slate-900 transition">
          교사 관리실 입장 →
        </span>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-400">
    학급 전용 소통 및 실태 조사 포털
  </footer>

  <!-- 학생 로그인 모달 -->
  <div id="modal-student" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-slate-900 mb-1">🎒 학생 로그인</h3>
      <p class="text-xs text-slate-500 mb-4">자신의 이름을 고르고 비밀번호를 입력하세요.</p>
      
      <div id="empty-roster-alert" class="hidden mb-3 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
        등록된 학생 명단이 없습니다. 선생님이 공유해 주신 전용 링크로 접속해 주세요.
      </div>

      <select id="stu-select" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl mb-3 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">-- 이름 선택 --</option>
      </select>
      <input type="password" id="stu-pin" placeholder="비밀번호 4자리" onkeydown="if(event.key==='Enter') loginStudent()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl mb-4 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
      <div class="flex justify-end gap-2">
        <button onclick="closeModals()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">취소</button>
        <button onclick="loginStudent()" class="px-4 py-2 text-sm font-bold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">입장하기</button>
      </div>
    </div>
  </div>

  <!-- 교사 로그인 모달 -->
  <div id="modal-teacher" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-slate-900 mb-1">🔒 교사 로그인</h3>
      <p class="text-xs text-slate-500 mb-4">교사 전용 비밀번호를 입력하세요. (초기 기본값: <b>1234</b>)</p>
      <input type="password" id="tea-pin" placeholder="교사 비밀번호" onkeydown="if(event.key==='Enter') loginTeacher()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl mb-4 text-sm outline-none focus:ring-2 focus:ring-slate-800" />
      <div class="flex justify-end gap-2">
        <button onclick="closeModals()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">취소</button>
        <button onclick="loginTeacher()" class="px-4 py-2 text-sm font-bold bg-slate-800 text-white rounded-lg hover:bg-slate-900">입장하기</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const title = ClassStore.getTitle();
      document.title = title;
      document.getElementById('portal-title').innerText = title;

      const roster = ClassStore.getRoster();
      const select = document.getElementById('stu-select');
      if (roster.length === 0) {
        document.getElementById('empty-roster-alert').classList.remove('hidden');
      } else {
        roster.forEach(s => {
          select.innerHTML += `<option value="${s.num}_${s.name}">${s.num}번 ${s.name}</option>`;
        });
      }
    });

    function openStudentModal() {
      document.getElementById('modal-student').classList.remove('hidden');
    }
    function openTeacherModal() {
      document.getElementById('modal-teacher').classList.remove('hidden');
      document.getElementById('tea-pin').focus();
    }
    function closeModals() {
      document.getElementById('modal-student').classList.add('hidden');
      document.getElementById('modal-teacher').classList.add('hidden');
    }

    function loginStudent() {
      const val = document.getElementById('stu-select').value;
      const pin = document.getElementById('stu-pin').value.trim();
      if (!val) return alert('이름을 선택해 주세요.');
      
      const roster = ClassStore.getRoster();
      const target = roster.find(s => `${s.num}_${s.name}` === val);
      if (!target || target.pin !== pin) {
        return alert('비밀번호가 일치하지 않습니다.');
      }

      ClassStore.setCurrentStudent(target);
      window.location.href = 'student-hub.html';
    }

    function loginTeacher() {
      const pin = document.getElementById('tea-pin').value;
      if (pin === ClassStore.getTeacherPw()) {
        sessionStorage.setItem('teacher_auth', 'true');
        window.location.href = 'teacher-hub.html';
      } else {
        alert('교사 비밀번호가 일치하지 않습니다.');
      }
    }
  </script>
</body>
</html>
